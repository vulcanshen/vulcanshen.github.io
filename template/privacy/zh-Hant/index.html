<!doctype html>
<!--
  隱私權政策範本（繁體中文）。複製到 <app>/privacy/zh-Hant/index.html，把 {{…}} 換掉，照註解填內容，最後刪掉所有註解。
  {{App}}            app 名稱（issues 與 mailto 網址裡的 [{{App}}] 名稱有空格的話寫成 %20）
  {{accent-light}}   淺色模式的主色；{{accent-dark}} 深色模式的主色
  {{date-zh}}        最後更新日期，例如 2026 年 10 月 12 日
  {{year}}           頁尾年份
  app 內也有政策的，兩邊逐字一致。規則見 README「支援頁與隱私權政策的規則」。
-->
<!-- iOS app 的 icon 是滿版正方形，在 style 加上 --icon-radius: 22.37% -->
<html lang="zh-Hant" style="--accent-light: {{accent-light}}; --accent-dark: {{accent-dark}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{App}} 隱私權政策</title>
  <link rel="stylesheet" href="../../../style.css">
</head>
<body>
<main>
  <header class="app-header">
    <!-- 有深色版 icon 的話換成 <picture>，用 <source srcset="../../icon-dark.png" media="(prefers-color-scheme: dark)"> -->
    <img src="../../icon.png" alt="">
    <h1>{{App}}</h1>
    <details class="langs">
      <summary>語言</summary>
      <ul>
        <li><a href="../" lang="en" hreflang="en">English</a></li>
        <li><a href="./" aria-current="page">繁體中文</a></li>
        <!-- 跟英文頁的選單列同一組語言 -->
      </ul>
    </details>
  </header>

  <h2>隱私權政策</h2>
  <p class="meta">最後更新：{{date-zh}}</p>
  <p class="lead">用一句話摘要這份政策。</p>

  <h3>{{App}} 收集哪些資料</h3>
  <p>{{App}} 收集哪些資料，或是完全不收集。</p>

  <h3>資料存在哪裡</h3>
  <p>資料存在哪裡，有沒有任何東西離開裝置。</p>

  <h3>第三方</h3>
  <ul>
    <li><strong>Apple 內購</strong>：購買由 Apple 處理。{{App}} 看不到你的付款資料或 Apple 帳號。</li>
  </ul>

  <h3>政策變更</h3>
  <p>如果這份政策有變更，會更新這個頁面和上面的日期。</p>

  <!-- 推廣頁沒有中文頁的話，app 名稱連到 ../../ -->
  <nav class="section-links">
    <a href="../../zh-Hant/">{{App}}</a>
    <a href="../../support/zh-Hant/">支援</a>
    <a href="./">隱私權政策</a>
    <a href="../../../">所有 app</a>
  </nav>

  <footer>© {{year}} Vulcan Shen</footer>
</main>
<script>
  // Close the language menu on a click outside it, or on Esc.
  const langs = document.querySelector(".langs");
  document.addEventListener("click", e => { if (!langs.contains(e.target)) langs.open = false; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") langs.open = false; });
</script>
</body>
</html>
